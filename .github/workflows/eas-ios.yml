# Build + (opcional) submit da app-vendor iOS via EAS, disparado à mão.
#
# Pré-requisitos:
#   - secret EXPO_TOKEN
#   - variable EAS_PROJECT_ID (id do `eas init` na org piquet-technologies)
#   - chave da App Store Connect carregada NO EAS (`eas credentials --platform ios`),
#     e não em secrets do GitHub — ver o passo do submit lá abaixo.
#
# Os secrets ASC_KEY_BASE64 / ASC_KEY_ID / ASC_ISSUER_ID deixaram de ser usados.
# Podem ser removidos do repositório.
name: EAS iOS (vendor)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Perfil EAS (eas.json)"
        default: "production"
      submit:
        description: "Submeter ao TestFlight depois do build"
        type: boolean
        default: true

jobs:
  ios:
    runs-on: ubuntu-latest
    env:
      EAS_OWNER: piquet-technologies
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          # O default desta ação é `yarn`, e era aí que o workflow morria: o
          # `package.json` declara `packageManager: npm@10.8.2`, o yarn 1 vê
          # esse campo a apontar para outro gestor, exige o Corepack e aborta —
          # antes sequer de instalar dependências. As três execuções que houve
          # falharam todas aqui, em menos de um minuto.
          #
          # Esta app usa npm (a do cliente usa yarn e não tem o campo; é por
          # isso que o mesmo workflow lá chegava mais longe).
          packager: npm

      - name: Verificar EAS_PROJECT_ID
        run: |
          test -n "$EAS_PROJECT_ID" || { echo "::error::Falta a variable EAS_PROJECT_ID (corre 'eas init' localmente e mete o id)"; exit 1; }

      - name: Instalar dependências
        run: npm ci

      - name: Build iOS
        run: |
          WAIT_FLAG="--no-wait"
          [ "${{ inputs.submit }}" = "true" ] && WAIT_FLAG="--wait"
          npx eas-cli@latest build --platform ios --profile "${{ inputs.profile }}" --non-interactive $WAIT_FLAG

      # A chave da App Store Connect vive no EAS, não aqui.
      #
      # Isto passava a chave por flags — `--asc-api-key-path`, `--asc-api-key-id`
      # e `--asc-api-key-issuer-id` — que a eas-cli deixou de ter. O passo
      # falhava sempre, mesmo que o build tivesse corrido.
      #
      # O caminho documentado para CI é guardar a chave no EAS com
      # `eas credentials --platform ios`: a partir daí o `submit` usa-a sozinho,
      # e a chave privada nunca passa pelo repositório nem pelos secrets do
      # GitHub. Fica também um segredo a menos para rodar quando alguém sair.
      #
      # PRÉ-REQUISITO: a chave tem de estar carregada no EAS. Enquanto não
      # estiver, este passo falha — e é suposto falhar de forma barulhenta em
      # vez de submeter nada.
      - name: Submeter ao TestFlight
        if: ${{ inputs.submit }}
        run: npx eas-cli@latest submit --platform ios --latest --non-interactive
