# Build (e opcionalmente submit) da app-vendor iOS via EAS, disparado à mão.
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   EXPO_TOKEN      (já colocado pelo André) — token da org `piquet-technologies`
#   ASC_KEY_BASE64  — ficheiro .p8 da App Store Connect API em base64
#   ASC_KEY_ID      — 348L9SN7ZZ
#   ASC_ISSUER_ID   — f0090ce9-8918-4925-9b4d-f7e66f581a9c
#
# `eas init` cria/liga o projeto `@piquet-technologies/piquet-vendor` na org nova.
name: EAS iOS (vendor)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Perfil EAS (eas.json)"
        default: "production"
      submit:
        description: "Submeter ao TestFlight depois do build"
        type: boolean
        default: true

jobs:
  ios:
    runs-on: ubuntu-latest
    env:
      EAS_OWNER: piquet-technologies
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Instalar dependências
        run: yarn install --frozen-lockfile
      - name: eas init
        run: npx eas-cli@latest init --non-interactive --force
      - name: Preparar chave ASC
        if: ${{ secrets.ASC_KEY_BASE64 != '' }}
        run: |
          echo "${{ secrets.ASC_KEY_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/asc_key.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc_key.p8" >> "$GITHUB_ENV"
      - name: EAS build iOS
        run: npx eas-cli@latest build --platform ios --profile "${{ inputs.profile }}" --non-interactive --no-wait
      # Submit à parte quando o build acabar:
      #   npx eas-cli submit -p ios --profile production \
      #     --asc-api-key-path "$ASC_KEY_PATH" --asc-api-key-id "${{ secrets.ASC_KEY_ID }}" \
      #     --asc-api-key-issuer-id "${{ secrets.ASC_ISSUER_ID }}"
